<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Configuración WiFi - ESP32-S3 CAM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #bb86fc;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #2d2d2d;
            border-radius: 5px;
        }
        .error{
            color:#ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Configuración WiFi - ESP32-S3 CAM</h1>
        <div class="error">
            <p>Por favor selecciona una red WiFi o ingrésala manually</p>
        </div>
        <button onclick="history.back()">Volver</button>
    </div>
</body>
</html>
