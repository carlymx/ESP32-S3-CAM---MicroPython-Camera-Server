<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32-S3 CAM - Vista en Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #bb86fc;
        }
        .video-container {
            margin: 20px auto;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 5px;
            text-align: left;
        }
        .config-link {
            margin-top: 20px;
            padding: 10px;
            background-color: #2d2d2d;
            border-radius: 5px;
        }
        a {
            color: #bb86fc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vista en Vivo - ESP32-S3 CAM</h1>
        <div class="video-container">
            <img src="/stream" alt="Flujo de video en vivo" id="videoFeed" width="640" height="480">
        </div>
        <div class="info">
            <h3>Información del dispositivo</h3>
            <p>Esta página muestra la transmisión en vivo de la cámara ESP32-S3 CAM.</p>
            <p>La imagen se actualiza automáticamente en tiempo real.</p>
        </div>
        <div class="config-link">
            <p>Ir a la <a href="/cam">página de configuración de la cámara</a></p>
        </div>
    </div>
</body>
</html>
